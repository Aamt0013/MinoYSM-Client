# Mod properties
# 命名：archives_name 决定产物前缀，mod_version 决定版本号。
# fabric 模块额外覆盖 archivesName（见 fabric/build.gradle），产物为
#   MinoYSM-Client-26.2-1.2.2.jar  —— 纯客户端版（environment: client）
# 与之前的双端版（MinoYSM-26.2-1.0.jar，environment: *）是两个独立产物，
# 二者 mod id 相同，不能同时放进 mods 目录。
# 注意：模组内部 id 仍为 yes_steve_model —— 模型包格式、服务端协议、配置文件路径都依赖它，
#       改名会导致已有模型包和配置失效。
#
# 版本历史：
#   1.0.0  纯客户端版首个可用版本
#   1.1.0  内置模型只保留 default（移除 wine_fox / misc，jar 减小约 19 MB）；
#          修复服务端代码未清理（纯客户端模式下跳过服务端事件/Mixin/reloadPacks）；
#          修复模型偶发加载失败（loadDefaultModel 幂等守卫）；
#          补回本地模型包元数据扫描（包图标紫黑格）；
#          透光扫描结果缓存 + 贴图缓存统一（启动 35s → 约 2s）；
#          补上黑名单在纯客户端模式下不生效的问题。
#   1.1.1  修复升级后旧版内置模型残留：built/ 改用版本戳判断是否需要重新解压。
#          此前只判断"目录非空就跳过"，导致从旧版升级的用户仍会加载
#          jar 中已移除的 wine_fox / misc 模型。
#          同时补上 blacklist.txt 模板在纯客户端模式下的创建。
#   1.2.0  修复手机端"大退"后配置丢失：ForgeConfigSpec 的 set() 只改内存不落盘，
#          额外玩家渲染位置 / 免责声明 / 提示位置在强制杀进程后都会回默认。
#          改为关闭界面、屏幕移除、拖拽结束时显式 save()。
#          数值字面量 FloatValue 驻留（61 模型省约 41 MB 堆）。
#          GeckoLibCache 绑定表与 GeoModel native 缓存加锁，为将来并行化留好前提。
#   1.2.1  修复轮盘个性化设置不持久：v.roaming.* 变量原本只由服务端保存并回传，
#          纯客户端模式下没有服务端，退出重进就回默认。
#          新增 config/yes_steve_model/molang_vars.json 按模型 id 本地保存，
#          模型加载时恢复；退出世界时强制落盘。
#   1.2.2  修正误导性提示：纯客户端版不再显示「服务端 YSM 模组版本与客户端不同」，
#          改为在本地一个模型都没加载到时提示检查 custom/ 目录（提前到扫描完成即提示）。
#          修复轮盘个性化设置不持久：纯客户端下 serverVarContainer 为 null，
#          v.roaming.* 的写入无处记录。改为本地玩家始终持有 RoamingStruct，
#          并按模型 id 存到 config/yes_steve_model/molang_vars.json。
#   1.2.3  修复个性化设置界面崩溃：屏幕渲染路径下 SubmitNodeCollector 为 null，
#          鞘翅层与鹦鹉层未做空值守卫，切换选项时 NPE 导致界面卡死。
#          新增卡顿看门狗（主线程超 3 秒未推进时打印堆栈）。
#          轮盘个性化设置本地读取改为无锁快路径。
#   1.2.4  修复单人游戏投射物消失：纯客户端模式跳过了 ServerCommonPacketListenerImplMixin，
#          导致 isPlayerConnected 里的强制转型抛 ClassCastException，从 setOwner 一路
#          中断实体创建 —— 雪球/箭/三叉戟/烟花/经验瓶全部不显示。
#          改为不再跳过任何服务端 Mixin（集成服务端与客户端同 JVM，"纯客户端用不到
#          服务端"这个假设本身就不成立），转型处全部加 instanceof 保护。
#          修复设置界面预览：改为走 PIP 渲染，不再依赖屏幕渲染路径的提交节点。
#          同类加固：载具、鱼钩、第一人称手部、手持物渲染在 collector 为 null 时
#          不再静默消失或 NPE。
mod_version = 1.2.4
maven_group = rip.ysm
archives_name = MinoYSM-Client-26.2
enabled_platforms = fabric

# Minecraft properties
minecraft_version = 26.2

# Dependencies
fabric_loader_version = 0.19.3
fabric_api_version = 0.161.0+26.2
forge_config_api_port_version = rSd3GiG8
architectury_api_version = 21.1.9
cardinal_components_version = 8.0.1
