org.gradle.parallel=true

# 本机构建环境（原仓库没有这些，为本地试编译补充）
org.gradle.java.installations.paths=C:\\Program Files\\Java\\jdk-21,D:\\tools\\jdk-25
org.gradle.java.home=D:\\tools\\jdk-25
systemProp.http.proxyHost=127.0.0.1
